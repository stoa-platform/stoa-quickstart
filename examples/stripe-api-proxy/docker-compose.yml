name: stoa-stripe-proxy

# Mock Stripe server for offline development.
# Assumes STOA quickstart is already running on the default network.
#
# Usage:
#   docker compose up -d        # Start mock Stripe server
#   ./setup.sh                  # Configure STOA gateway
#
# For real Stripe: set UPSTREAM_URL=https://api.stripe.com in setup.sh

services:
  # ─────────────────────────────────────────────────────────────────
  # Mock Stripe API — simulates Stripe responses for local dev
  # Responds to GET /v1/charges, POST /v1/charges, GET /v1/customers
  # ─────────────────────────────────────────────────────────────────
  stripe-mock:
    image: stripemock/stripe-mock:latest
    container_name: stoa-stripe-mock
    ports:
      - "12111:12111"   # HTTP
      - "12112:12112"   # HTTPS
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:12111/v1/charges"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: stoa-network
    external: true
